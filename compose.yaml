services:
  hyperhdr:
    image: ubuntu:24.04
    container_name: hyperhdr
    network_mode: host
    userns_mode: keep-id
    user: "0:0"
    environment:
      - TZ=Europe/London
      - HOME=/config
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - XDG_RUNTIME_DIR=/run/user/1001
      - PIPEWIRE_RUNTIME_DIR=/run/user/1001
      - WAYLAND_DISPLAY=wayland-0
      - XDG_SESSION_TYPE=wayland
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1001/bus
    security_opt:
      - label=disable
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /var/home/user/.hyperhdr:/config/.config/HyperHDR:z
      - /run/user/1001:/run/user/1001
    configs:
      - source: start
        target: /start.sh
        mode: 0755
    entrypoint: ["/start.sh"]
    restart: unless-stopped

configs:
  start:
    content: |
      #!/bin/sh
      set -e
      if ! command -v hyperhdr >/dev/null 2>&1; then
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates curl util-linux libpipewire-0.3-0t64 \
          libpipewire-0.3-common libpipewire-0.3-modules libspa-0.2-modules \
          pipewire-bin libasound2t64 libx11-6 libdbus-1-3
        URL=$$(curl -s https://api.github.com/repos/awawa-dev/HyperHDR/releases/latest \
          | grep browser_download_url | grep -E 'amd64|x86_64' | grep '\.deb' | head -1 | cut -d'"' -f4)
        curl -L -o /tmp/hyperhdr.deb "$$URL"
        apt-get install -y /tmp/hyperhdr.deb
        rm -rf /tmp/hyperhdr.deb /var/lib/apt/lists/*
      fi
      exec setpriv --reuid=1001 --regid=1001 --clear-groups hyperhdr --pipewire
